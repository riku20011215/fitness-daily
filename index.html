<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitnessDaily">
<meta name="theme-color" content="#0F1318">
<title>FitnessDaily｜フィットネス管理</title>
</head>
<body>
<div id="app"></div>
<style>
  :root {
    --bg: #0F1318; --card: #171D25; --cardsoft: #1D242E; --line: #28313D;
    --text: #E9EDF1; --sub: #8A96A3; --now: #F5A524; --done: #4ADE80;
    --red: #F87171; --blue: #60A5FA;
    --pushA: #F5A524; --pushB: #FB923C; --pullA: #A78BFA; --pullB: #818CF8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #131920; }
  #app {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 430px; margin: 0 auto;
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  button { font-family: inherit; cursor: pointer; }
  .hdr {
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px 0;
    background: linear-gradient(180deg, #131920 0%, var(--bg) 100%);
  }
  .clock { font-size: 52px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums;
    font-family: "Avenir Next Condensed", "Futura", -apple-system, sans-serif; letter-spacing: 1px; }
  .badge { border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; display: inline-block; }
  .tabs { display: flex; gap: 2px; margin-top: 14px; }
  .tabbtn { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 700; color: var(--sub);
    background: transparent; border: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabbtn.on { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .cardp { padding: 16px; }
  .sect { padding: 16px 16px 0; }
  .stitle { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .input { width: 100%; background: var(--cardsoft); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 16px; outline: none; }
  .lbl { font-size: 12px; color: var(--sub); margin-bottom: 4px; display: block; }
  .btn { width: 100%; background: var(--now); border: none; border-radius: 12px; color: #0F1318;
    padding: 13px; font-size: 15px; font-weight: 700; margin-top: 12px; }
  .btn.ghost { background: var(--cardsoft); color: var(--text); border: 1px solid var(--line); }
  .chk { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 16px; background: transparent; border: none; border-top: 1px solid var(--line);
    color: var(--text); font-size: 14.5px; }
  .chk:first-child { border-top: none; }
  .box { width: 22px; height: 22px; min-width: 22px; border-radius: 7px; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: #0F1318; font-size: 14px; font-weight: 800; }
  .chk.on { color: var(--sub); }
  .chk.on .box { border-color: var(--done); background: var(--done); }
  .chk.on .txt { text-decoration: line-through; }
  .tl { display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  .tl:first-child { border-top: none; }
  .tl.now { background: rgba(245,165,36,0.08); border-left-color: var(--now); }
  .tl.past { opacity: 0.45; }
  .tltime { font-size: 13px; color: var(--sub); min-width: 44px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .tl.now .tltime { color: var(--now); font-weight: 700; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  .calcell { background: transparent; border: 2px solid transparent; border-radius: 10px;
    padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .navbtn { background: var(--cardsoft); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 8px 16px; font-size: 15px; }
  .savedmsg { margin: 12px 16px 0; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.33);
    color: var(--done); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
  textarea.input { height: 200px; font-size: 12px; line-height: 1.5; font-family: monospace; resize: vertical; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--cardsoft);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .segbtn { padding: 7px 0 8px; font-size: 12px; font-weight: 700; border: none;
    background: transparent; color: var(--sub); border-radius: 9px; line-height: 1.35; }
  .segday { display: block; font-size: 10px; font-weight: 600; opacity: 0.75; }
  .exrow { padding: 12px 16px; border-top: 1px solid var(--line); }
  .exrow:first-child { border-top: none; }
  .exhead { display: flex; gap: 10px; align-items: baseline; }
  .exnum { color: var(--now); font-weight: 700; font-size: 13px; min-width: 24px; }
  .exname { font-size: 14.5px; font-weight: 600; flex: 1; }
  .exset { font-size: 12.5px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .exsub { font-size: 12px; color: var(--sub); margin-top: 3px; padding-left: 34px; line-height: 1.5; }
  .memo { background: var(--cardsoft); border-radius: 12px; padding: 14px 16px; margin-top: 12px;
    font-size: 12.5px; color: var(--sub); line-height: 1.75; }
  .memo b { color: var(--text); }
  .logrow { padding: 12px 16px; border-top: 1px solid var(--line); }
  .logrow:first-child { border-top: none; }
  .logname { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .loginputs { display: flex; gap: 8px; }
  .loginputs > div { flex: 1; }
  .mini { font-size: 11px; color: var(--sub); margin-bottom: 3px; display: block; }
  .input.sm { padding: 8px 10px; font-size: 15px; }
  .trigbar { height: 8px; background: var(--cardsoft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .volrow { display: flex; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--line); }
  .volrow:first-child { border-top: none; }
  .exwrap { display: flex; gap: 12px; align-items: flex-start; }
  .exbody { flex: 1; min-width: 0; }
  .exthumb { width: 62px; height: 62px; flex-shrink: 0; border-radius: 10px; background: #fff;
    object-fit: contain; padding: 3px; border: 1px solid var(--line); }
  .exmiss { width: 62px; height: 62px; flex-shrink: 0; border-radius: 10px; border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 10px; line-height: 1.3; color: var(--sub); text-decoration: none; padding: 4px; }
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  .ovl img { max-width: 100%; max-height: 68vh; background: #fff; border-radius: 14px; padding: 8px; }
  .ovlcap { font-size: 12px; color: var(--sub); text-align: center; line-height: 1.7; }
  .ovlcap a { color: var(--blue); }
</style>

      if (window.storage && window.storage.get) {

      }
      try { return localStorage.getItem("fd_" + key); } catch { return null; }
    },
    async set(key, value) {
      if (window.storage && window.storage.set) {
        try { await window.storage.set(key, value); return true; } catch { return false; }
      }

  };

          const fa = parseFloat(a.w)*parseFloat(a.bf)/100, fb = parseFloat(b.w)*parseFloat(b.bf)/100;
          const la = parseFloat(a.w)-fa, lb = parseFloat(b.w)-fb;
          const dw = parseFloat(b.w)-parseFloat(a.w), dl = lb-la, df = fb-fa;
          const wk = (new Date(bd[bd.length-1]) - new Date(bd[0])) / (7*86400000);
          h += '<div style="font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.8">' +
            "開始からの増加 <b style=\"color:var(--text)\">" + dw.toFixed(2) + "kg</b>（除脂肪 +" + dl.toFixed(2) + "kg／脂肪 +" + df.toFixed(2) + "kg）<br>" +
            "除脂肪の割合 <b style=\"color:var(--done)\">" + Math.round(dl/dw*100) + "%</b>　ペース <b style=\"color:var(--text)\">週+" + (dw/wk).toFixed(2) + "kg</b>（目標 +0.2〜0.3）</div>";
        }
      }
      h += "</div>";

      const gd = Object.keys(S.gymLog).sort().reverse();
      h += '<div class="card cardp" style="margin-top:16px"><div class="stitle">トレーニング履歴</div>';
      if (!gd.length) {
        h += '<div style="font-size:13px;color:var(--sub)">まだ記録がありません。</div>';
      } else {
        gd.slice(0,10).forEach((d) => {
          const r = S.gymLog[d], di = DAY_TYPES[r.type] || { raw:"var(--sub)", label:"" };
          const defs = LOG_EX[r.type] || [];
          const p = defs.filter((e) => r.ex && r.ex[e.k] && r.ex[e.k].r)
            .map((e) => e.n + " " + (r.ex[e.k].w||"") + "×" + r.ex[e.k].r);
          h += '<div style="padding:10px 0;border-bottom:1px solid var(--line)">' +
            '<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--sub)">' + d.slice(5).replace("-","/") + "</span>" +
            '<span class="badge" style="background:' + di.raw + "22;color:" + di.raw + ';font-size:11px;padding:2px 8px">' + di.label + "</span></div>" +
            '<div style="font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.7">' + esc(p.join(" ／ ")) + "</div></div>";
        });
      }
      h += "</div></div>";
    }

    document.getElementById("app").innerHTML = h + zoomOverlay();
    bindEvents();
  }

  /* 画像の拡大表示 */
  function zoomOverlay() {
    if (!S.zoom) return "";
    return '<div class="ovl" data-act="closeZoom">' +
      '<img src="' + commonsImg(S.zoom, 900) + '" alt="">' +
      '<div class="ovlcap">' + esc(S.zoom) + "<br>" +
      'Wikimedia Commons ／ <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 3.0</a>　' +
      '<a href="' + commonsPage(S.zoom) + '" target="_blank" rel="noopener">ファイルページ</a><br>' +
      "どこかをタップで閉じる</div></div>";
  }

  /* ============ フォーム退避 ============ */
  function captureForm() {
    ["bDate","bW","bF","bM","bNote","gDate","gNote"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) S.form[id] = el.value;
    });
    document.querySelectorAll("[data-ex]").forEach((el) => {
      const k = el.dataset.ex, f = el.dataset.fld;
      if (!S.logEx[k]) S.logEx[k] = { w:"", r:"" };
      S.logEx[k][f] = el.value;
    });
  }

  function buildExport() {
    const now = S.now, t = dayTypeOf(now), holName = hol(now), info = DAY_TYPES[t];
    const list = checklistOf(t);
    const bd = Object.keys(S.bodyLog).sort(), gd = Object.keys(S.gymLog).sort();
    let txt = "【フィットネス記録データ】\n出力：" + dk(now) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) +
      "\n構成：4分割（月プッシュA／火プルA／水休養／木プッシュB／金プルB）上半身メイン・脚は維持のみ" +
      "\n現在：増量期（トリガー 体重73〜75kg または 体脂肪率21%超）\n最終目標：体脂肪率15%\n\n";

    txt += "■ 体組成（" + bd.length + "件）\n";
    if (!bd.length) txt += "（記録なし）\n";
    bd.forEach((d) => {
      const r = S.bodyLog[d], p = [];
      if (r.w) p.push("体重" + r.w + "kg");
      if (r.bf) p.push("体脂肪率" + r.bf + "%");
      if (r.mm) p.push("筋肉量" + r.mm + "kg");
      if (r.note) p.push("メモ:" + r.note);
      txt += d + "：" + p.join("・") + "\n";
    });

    txt += "\n■ トレーニング記録（Markdown表・そのまま貼れます）\n";
    txt += "| 日付 | 種目 | 重量・設定 | 実績 | メニュー |\n|------|------|-----------|------|------|\n";
    if (!gd.length) txt += "（記録なし）\n";
    gd.forEach((d) => {
      const r = S.gymLog[d], defs = LOG_EX[r.type] || [];
      const lb = (DAY_TYPES[r.type] || { label:"" }).label;
      defs.forEach((e) => {
        const v = r.ex && r.ex[e.k];
        if (!v || (!v.w && !v.r)) return;
        txt += "| " + d + " | " + e.n + " | " + (v.w||"") + " | " + (v.r||"") + " | " + lb + " |\n";
      });
      if (r.note) txt += "（" + d + " メモ：" + r.note + "）\n";
    });

    const done = list.filter((c) => S.checked[c.id]).map((c) => c.t);
    const undone = list.filter((c) => !S.checked[c.id]).map((c) => c.t);
    txt += "\n■ 今日（" + dk(now) + "・" + (holName ? "祝日:"+holName : info.label) + "）のチェック\n完了：" +
      (done.length ? done.join("／") : "なし") + "\n未完了：" + (undone.length ? undone.join("／") : "なし") +
      "\n\nこのデータをもとに、進捗の分析と次回の重量設定をお願いします。";
    return txt;
  }

  /* ============ イベント ============ */
  function bindEvents() {
    document.querySelectorAll("[data-tab]").forEach((el) => {
      el.onclick = () => {
        captureForm();
        S.tab = el.dataset.tab;
        if (S.tab === "log") loadLogForm();
        render();
      };
    });
    document.querySelectorAll("[data-train]").forEach((el) => {
      el.onclick = () => { S.trainView = el.dataset.train; render(); };
    });
    document.querySelectorAll("[data-logtype]").forEach((el) => {
      el.onclick = () => { captureForm(); S.logType = el.dataset.logtype; loadLogForm(); render(); };
    });
    document.querySelectorAll("[data-check]").forEach((el) => {
      el.onclick = async () => {
        const id = el.dataset.check;
        S.checked[id] = !S.checked[id];
        render();
        await store.set("check:" + dk(S.now), JSON.stringify(S.checked));
      };
    });
    document.querySelectorAll("[data-img]").forEach((el) => {
      const fallback = () => {
        const q = el.dataset.q || "";
        const a = document.createElement("a");
        a.className = "exmiss";
        a.target = "_blank";
        a.rel = "noopener";
        a.href = commonsSearch(q);
        a.textContent = "画像を探す";
        if (el.parentNode) el.parentNode.replaceChild(a, el);
      };
      el.onerror = fallback;
      if (el.complete && el.naturalWidth === 0) fallback();
      el.onclick = () => { S.zoom = el.dataset.img; render(); };
    });
    document.querySelectorAll("[data-sel]").forEach((el) => {
      el.onclick = () => { S.selDate = el.dataset.sel; render(); };
    });
    const gDateEl = document.getElementById("gDate");
    if (gDateEl) gDateEl.onchange = () => {
      captureForm();
      const d = new Date(gDateEl.value + "T00:00:00");
      if (!isNaN(d)) { const ty = dayTypeOf(d); if (isGym(ty)) S.logType = ty; }
      loadLogForm(); render();
    };
    document.querySelectorAll("[data-act]").forEach((el) => {
      el.onclick = async () => {
        const act = el.dataset.act;
        if (act === "closeZoom") { S.zoom = ""; render(); return; }
        if (act === "prevM" || act === "nextM") {
          let y = S.calY, mo = S.calM + (act === "nextM" ? 1 : -1);
          if (mo < 0) { mo = 11; y--; }
          if (mo > 11) { mo = 0; y++; }
          S.calY = y; S.calM = mo; render();
        }
        if (act === "saveBody") {
          captureForm();
          const f = S.form;
          if (!f.bW && !f.bF && !f.bM) { flash("数値を入力してください"); return; }
          S.bodyLog[f.bDate] = { w:f.bW||null, bf:f.bF||null, mm:f.bM||null, note:f.bNote||"" };
          const ok = await store.set("bodylog", JSON.stringify(S.bodyLog));
          S.form.bNote = "";
          flash(ok ? "体組成を保存しました" : "保存に失敗しました");
        }
        if (act === "saveGym") {
          captureForm();
          const f = S.form;
          const ex = {};
          let any = false;
          (LOG_EX[S.logType] || []).forEach((e) => {
            const v = S.logEx[e.k] || { w:"", r:"" };
            ex[e.k] = { w:v.w||"", r:v.r||"" };
            if (v.r) any = true;
          });
          if (!any) { flash("実績（回数）を1種目以上入力してください"); return; }
          S.gymLog[f.gDate] = { type:S.logType, ex:ex, note:f.gNote||"" };
          const ok = await store.set("gymlog", JSON.stringify(S.gymLog));
          flash(ok ? "トレーニングを保存しました" : "保存に失敗しました");
        }
        if (act === "export") {
          S.exportText = buildExport();
          try { await navigator.clipboard.writeText(S.exportText); S.copied = true; }
          catch { S.copied = false; }
          render();
          setTimeout(() => { S.copied = false; render(); }, 2500);
        }
      };
    });
    const ta = document.getElementById("exportArea");
    if (ta) ta.onfocus = () => ta.select();
  }

  /* ============ 初期化 ============ */
  (async function init() {
    const d = new Date();
    S.now = d; S.calY = d.getFullYear(); S.calM = d.getMonth();
    S.selDate = dk(d);
    S.form.bDate = dk(d); S.form.gDate = dk(d);
    const ty = dayTypeOf(d);
    S.logType = isGym(ty) ? ty : "pushA";
    S.trainView = isGym(ty) ? ty : "pushA";
    await loadAll();
    loadLogForm();
    render();

    /* 15秒ごと。入力中の値を消さないよう、今日タブ以外は時計だけ差し替える */
    setInterval(() => {
      const prev = dk(S.now);
      S.now = new Date();
      if (prev !== dk(S.now)) {           // 日付が変わった → 全体を作り直す
        S.calY = S.now.getFullYear(); S.calM = S.now.getMonth();
        S.selDate = dk(S.now);
        loadAll().then(render);
        return;
      }
      if (S.tab === "today") { render(); return; }
      const eh = document.getElementById("clockH"), em = document.getElementById("clockM");
      if (eh) eh.textContent = pad(S.now.getHours());
      if (em) em.textContent = pad(S.now.getMinutes());
    }, 15000);

    /* バックグラウンドから戻ったとき。iOSはタイマーを止めるのでここで追いつかせる */
    if (document.addEventListener) {
      document.addEventListener("visibilitychange", async () => {
        if (document.hidden) return;
        captureForm();
        const prev = dk(S.now);
        S.now = new Date();
        if (prev !== dk(S.now)) {
          S.calY = S.now.getFullYear(); S.calM = S.now.getMonth();
          S.selDate = dk(S.now);
        }
        await loadAll();
        render();
      });
    }
  })();
})();
</script>
</body>
</html>
