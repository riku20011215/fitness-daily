<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitnessDaily">

<title>FitnessDaily｜フィットネス管理</title>
</head>
<body>
<div id="app"></div>
<style>
  :root {
    --bg: #0F1318; --card: #171D25; --cardsoft: #1D242E; --line: #28313D;
    --text: #E9EDF1; --sub: #8A96A3; --now: #F5A524; --done: #4ADE80;
    --red: #F87171; --blue: #60A5FA; --push: #F5A524; --pull: #A78BFA; --legs: #34D399;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  #app {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 430px; margin: 0 auto; padding-bottom: 48px;
  }
  button { font-family: inherit; cursor: pointer; }
  .hdr { padding: 20px 20px 0; background: linear-gradient(180deg, #131920 0%, var(--bg) 100%); }
  .clock { font-size: 52px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums;
    font-family: "Avenir Next Condensed", "Futura", -apple-system, sans-serif; letter-spacing: 1px; }
  .badge { border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; display: inline-block; }
  .refresh { background: var(--cardsoft); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tabs { display: flex; gap: 2px; margin-top: 14px; }
  .tabbtn { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 700; color: var(--sub);
    background: transparent; border: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabbtn.on { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .cardp { padding: 16px; }
  .sect { padding: 16px 16px 0; }
  .stitle { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .input { width: 100%; background: var(--cardsoft); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 16px; outline: none; }
  .lbl { font-size: 12px; color: var(--sub); margin-bottom: 4px; display: block; }
  .btn { width: 100%; background: var(--now); border: none; border-radius: 12px; color: #0F1318;
    padding: 13px; font-size: 15px; font-weight: 700; margin-top: 12px; }
  .btn.ghost { background: var(--cardsoft); color: var(--text); border: 1px solid var(--line); }
  .chk { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 16px; background: transparent; border: none; border-top: 1px solid var(--line);
    color: var(--text); font-size: 14.5px; }
  .chk:first-child { border-top: none; }
  .box { width: 22px; height: 22px; min-width: 22px; border-radius: 7px; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: #0F1318; font-size: 14px; font-weight: 800; }
  .chk.on { color: var(--sub); }
  .chk.on .box { border-color: var(--done); background: var(--done); }
  .chk.on .txt { text-decoration: line-through; }
  .tl { display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  .tl:first-child { border-top: none; }
  .tl.now { background: rgba(245,165,36,0.08); border-left-color: var(--now); }
  .tl.past { opacity: 0.45; }
  .tltime { font-size: 13px; color: var(--sub); min-width: 44px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .tl.now .tltime { color: var(--now); font-weight: 700; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  .calcell { background: transparent; border: 2px solid transparent; border-radius: 10px;
    padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .navbtn { background: var(--cardsoft); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 8px 16px; font-size: 15px; }
  .savedmsg { margin: 12px 16px 0; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.33);
    color: var(--done); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
  textarea.input { height: 200px; font-size: 12px; line-height: 1.5; font-family: monospace; resize: vertical; }
  .seg { display: flex; gap: 4px; background: var(--cardsoft); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; }
  .segbtn { flex: 1; padding: 9px 0; font-size: 13px; font-weight: 700; border: none;
    background: transparent; color: var(--sub); border-radius: 9px; }
  .exrow { padding: 12px 16px; border-top: 1px solid var(--line); }
  .exrow:first-child { border-top: none; }
  .exhead { display: flex; gap: 10px; align-items: baseline; }
  .exnum { color: var(--now); font-weight: 700; font-size: 13px; min-width: 24px; }
  .exname { font-size: 14.5px; font-weight: 600; flex: 1; }
  .exset { font-size: 12.5px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .exsub { font-size: 12px; color: var(--sub); margin-top: 3px; padding-left: 34px; line-height: 1.5; }
  .memo { background: var(--cardsoft); border-radius: 12px; padding: 14px 16px; margin-top: 12px;
    font-size: 12.5px; color: var(--sub); line-height: 1.75; }
  .memo b { color: var(--text); }
  .logrow { padding: 12px 16px; border-top: 1px solid var(--line); }
  .logrow:first-child { border-top: none; }
  .logname { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .loginputs { display: flex; gap: 8px; }
  .loginputs > div { flex: 1; }
  .mini { font-size: 11px; color: var(--sub); margin-bottom: 3px; display: block; }
  .input.sm { padding: 8px 10px; font-size: 15px; }
  .trigbar { height: 8px; background: var(--cardsoft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
</style>
<script>

    async get(key) {
      if (window.storage && window.storage.get) {

      try { return localStorage.getItem("fd_" + key); } catch { return null; }

    async set(key, value) {
      if (window.storage && window.storage.set) {
        try { await window.storage.set(key, value); return true; } catch { return false; }

    return "free";

      ],
    },
    legs: {
      day: "金曜",
      total: "合計21セット／所要95〜100分",
      rows: [
        ["①","動的ストレッチ","股関節・足首を重点的に","5分","—"],

  const COMMON_RULES =
    "<b>追い込み度</b>：限界の1〜2回手前（RIR1〜2）。単関節はRIR0〜1<br>" +

  /* ============ 記録タブの種目定義 ============ */

  /* ============ タイムライン ============ */

  function restBlocks() {
    return [
      { s:M(8,30),  e:M(8,45),  t:"起床・水200ml・体重計測", d:"トイレ後・朝食前に計測" },
      { s:M(8,45),  e:M(9,0),   t:"出発", d:"" },
      { s:M(9,0),   e:M(9,30),  t:"出社・BASE BREAD＋ゆで卵2個", d:"P13.6g＋12g" },
      { s:M(9,30),  e:M(13,0),  t:"勤務（前半）", d:"水コップ2杯" },
      { s:M(13,0),  e:M(13,30), t:"昼食（外食）", d:"P30g以上・700〜900kcal" },
      { s:M(13,30), e:M(15,0),  t:"勤務", d:"" },
      { s:M(15,0),  e:M(15,10), t:"プロテイン＋クレアチン5g", d:"休養日も飛ばさない" },
      { s:M(15,10), e:M(19,0),  t:"勤務（後半）", d:"水コップ2杯" },
      { s:M(19,0),  e:M(19,45), t:"退勤 → 夕食購入", d:"木曜はオオゼキ自炊も" },
      { s:M(19,45), e:M(20,30), t:"夕食", d:"納豆1パックかゆで卵を追加してP135g前後に乗せる" },
      { s:M(20,30), e:M(21,0),  t:"入浴＋マッサージ20分", d:"" },
      { s:M(21,0),  e:M(24,0),  t:"自由時間", d:"24:00就寝" },
    ];
  }
  function freeBlocks(w, isHol) {
    return [
      { s:M(8,30),  e:M(10,0), t:"起床・体重計測", d:"食事管理は緩めでよい" },
      { s:M(10,0),  e:M(15,0), t:"自由に過ごす", d:isHol ? "祝日。ジムに行くなら空いている昼間" : "よく歩くことを意識" },
      { s:M(15,0),  e:M(15,10),t:"プロテイン＋クレアチン5g", d:"ここだけは継続" },
      { s:M(15,10), e:M(22,0), t:"自由に過ごす", d:w === 0 ? "飲み会・外食はこの日に寄せる" : "" },
      { s:M(22,0),  e:M(24,0), t:"生活リズムを戻す", d:"24:00就寝で翌日に備える" },
    ];
  }
  const blocksOf = (t, w) =>
    t === "rest" ? restBlocks() : t === "free" ? freeBlocks(w,false) : t === "holiday" ? freeBlocks(w,true) : gymBlocks(t);

  /* ============ チェックリスト ============ */
  function checklistOf(t) {
    if (t === "free" || t === "holiday") return [
      { id:"water",   t:"起床後すぐ水コップ1杯" },
      { id:"weigh",   t:"体重計測（起床後・トイレ後・朝食前）" },
      { id:"cre",     t:"プロテイン＋クレアチン5g" },
      { id:"walk",    t:"よく歩く" },
    ];
    if (t === "rest") return [
      { id:"water",   t:"起床後すぐ水コップ1杯" },
      { id:"weigh",   t:"体重計測（起床後・トイレ後・朝食前）" },
      { id:"bread",   t:"BASE BREAD＋ゆで卵2個" },
      { id:"water4",  t:"勤務中に水コップ4杯（約800ml）" },
      { id:"lunch",   t:"昼食をClaudeと相談（P30g以上）" },
      { id:"cre",     t:"15:00 プロテイン＋クレアチン5g" },
      { id:"dinner",  t:"夕食に納豆か卵を追加（P35g以上）" },
      { id:"protein", t:"タンパク質140g以上" },
      { id:"sleep",   t:"24:00までに就寝" },
    ];
    return [
      { id:"water",   t:"起床後すぐ水コップ1杯" },
      { id:"weigh",   t:"体重計測（起床後・トイレ後・朝食前）" },
      { id:"bread",   t:"BASE BREAD＋EAA" },
      { id:"water4",  t:"勤務中に水コップ4杯（約800ml）" },
      { id:"lunch",   t:"昼食をClaudeと相談（P30g以上）" },
      { id:"snack",   t:"17:30 おにぎり1個" },
      { id:"p1",      t:"ジム前プロテイン" },
      { id:"train",   t:"トレーニング完了" },
      { id:"p2",      t:"ジム後プロテイン＋クレアチン5g" },
      { id:"dinner",  t:"夕食（P35g以上）" },
      { id:"protein", t:"タンパク質140g以上" },
      { id:"log",     t:"重量をClaudeに報告" },
      { id:"sleep",   t:"24:00までに就寝" },
    ];
  }

  /* ============ 初期データ ============ */
  const SEED_BODY = {
    "2026-05-27": { w:"68.80", bf:"19.90", mm:"52.30", note:"プログラム開始" },
    "2026-07-01": { w:"70.80", bf:"18.90", mm:"54.40", note:"" },
    "2026-07-21": { w:"71.90", bf:"20.90", mm:"53.90", note:"体脂肪率のピーク" },
    "2026-07-22": { w:"71.20", bf:"20.50", mm:"53.70", note:"" },
    "2026-08-03": { w:"72.00", bf:"20.40", mm:"54.30", note:"内臓脂肪7.0・基礎代謝1644" },
  };
  const SEED_GYM = {
    "2026-08-03": { type:"push", ex:{
      bench:{w:"40", r:"12/12/12/10"}, incline:{w:"8", r:"12/12/12"},
      shoulder:{w:"35", r:"10/10/10"}, side:{w:"5", r:"12/12/12"},
      pushdown:{w:"12.5", r:"15/15/15"}, crunch:{w:"5", r:"10/10/10"},
      cardio:{w:"10%/4.5", r:"15分"} }, note:"3分割の初回。ベンチ4set目が10で届かず" },
  };

  const GOAL = { triggerW: 73.0, triggerBf: 21.0, finalBf: 15.0 };

  /* ============ 状態 ============ */
  const S = {
    now:new Date(), tab:"today", checked:{}, bodyLog:{}, gymLog:{},
    calY:0, calM:0, selDate:"", savedMsg:"", exportText:"", copied:false,
    trainView:"", logType:"",
    form:{ bDate:"", bW:"", bF:"", bM:"", bNote:"", gDate:"", gNote:"" },
    logEx:{},
  };

  async function loadAll() {
    const c = await store.get("check:" + dk(S.now));
    S.checked = c ? JSON.parse(c) : {};
    const b = await store.get("bodylog");
    S.bodyLog = b ? JSON.parse(b) : {};
    if (!Object.keys(S.bodyLog).length) { S.bodyLog = JSON.parse(JSON.stringify(SEED_BODY)); await store.set("bodylog", JSON.stringify(S.bodyLog)); }
    const g = await store.get("gymlog");
    S.gymLog = g ? JSON.parse(g) : {};
    if (!Object.keys(S.gymLog).length) { S.gymLog = JSON.parse(JSON.stringify(SEED_GYM)); await store.set("gymlog", JSON.stringify(S.gymLog)); }
  }

  function flash(msg) {
    S.savedMsg = msg; render();
    setTimeout(() => { S.savedMsg = ""; render(); }, 2200);
  }

  function loadLogForm() {
    const d = S.form.gDate;
    const rec = S.gymLog[d];
    const list = LOG_EX[S.logType] || [];
    S.logEx = {};
    list.forEach((e) => {
      const r = rec && rec.ex && rec.ex[e.k];
      S.logEx[e.k] = { w: r ? (r.w || "") : e.w, r: r ? (r.r || "") : "" };
    });
    S.form.gNote = rec ? (rec.note || "") : "";
  }

  /* ============ 描画 ============ */
  function render() {
    const now = S.now, todayStr = dk(now);
    const t = dayTypeOf(now), holName = hol(now), info = DAY_TYPES[t];
    const blocks = blocksOf(t, now.getDay());
    const list = checklistOf(t);
    const nowMin = now.getHours()*60 + now.getMinutes();
    const curIdx = blocks.findIndex((b) => nowMin >= b.s && nowMin < b.e);
    const before = nowMin < blocks[0].s;
    const after = nowMin >= blocks[blocks.length-1].e;
    const prog = Math.min(100, Math.max(0, ((nowMin - blocks[0].s) / (blocks[blocks.length-1].e - blocks[0].s)) * 100));
    const doneN = list.filter((c) => S.checked[c.id]).length;
    const acc = info.raw;

    let h = "";

    /* ---- ヘッダー ---- */
    h += '<div class="hdr"><div style="display:flex;justify-content:space-between;align-items:flex-start">';
    h += '<div><div style="font-size:13px;color:var(--sub);letter-spacing:1px">' +
      now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日（" + WD[now.getDay()] + "）" +
      (holName ? '<span style="color:var(--red);margin-left:6px">' + esc(holName) + "</span>" : "") + "</div>";
    h += '<div class="clock">' + pad(now.getHours()) + '<span style="color:' + acc + '">:</span>' + pad(now.getMinutes()) + "</div></div>";
    h += '<button class="refresh" data-act="refresh">↻ 更新</button></div>';
    h += '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">';
    h += '<span class="badge" style="background:' + acc + '22;color:' + acc + ';border:1px solid ' + acc + '55">' +
      (holName ? "祝日・" + esc(holName) : info.label) + "</span>";
    h += '<span style="font-size:12px;color:var(--sub)">' + info.sub + "</span></div>";
    h += '<div style="margin-top:12px"><div style="height:6px;background:var(--cardsoft);border-radius:999px;overflow:hidden">' +
      '<div style="width:' + prog + "%;height:100%;background:linear-gradient(90deg," + acc + "88," + acc + ');border-radius:999px"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:4px"><span>8:30</span><span>24:00</span></div></div>';
    h += '<div class="tabs">';
    [["today","今日"],["train","トレ"],["log","記録"],["cal","カレンダー"],["data","データ"]].forEach(([id,lb]) => {
      h += '<button class="tabbtn' + (S.tab===id?" on":"") + '" data-tab="' + id + '" style="' +
        (id==="cal"?"flex:1.4;":"") + (S.tab===id?"border-bottom-color:"+acc:"") + '">' + lb + "</button>";
    });
    h += "</div></div><div style=\"border-top:1px solid var(--line)\"></div>";
    if (S.savedMsg) h += '<div class="savedmsg">' + esc(S.savedMsg) + "</div>";

    /* ---- 今日 ---- */
    if (S.tab === "today") {
      h += '<div class="sect"><div class="card cardp" style="' + (curIdx>=0?"border-color:"+acc+"66":"") + '">';
      h += '<div style="font-size:11px;color:' + acc + ';font-weight:700;letter-spacing:2px">NOW</div>';
      if (before) {
        h += '<div style="margin-top:6px"><div style="font-size:18px;font-weight:700">起床前</div>' +
          '<div style="font-size:13px;color:var(--sub);margin-top:2px">8:30 起床 → 水コップ1杯 → トイレ → 体重計測</div></div>';
      } else if (after) {
        h += '<div style="margin-top:6px"><div style="font-size:18px;font-weight:700">就寝時間</div>' +
          '<div style="font-size:13px;color:var(--sub);margin-top:2px">おつかれさまでした。8:30起床に備えて休んでください</div></div>';
      } else {
        const b = blocks[curIdx];
        h += '<div style="margin-top:6px"><div style="font-size:18px;font-weight:700">' + esc(b.t) + "</div>";
        if (b.d) h += '<div style="font-size:13px;color:var(--sub);margin-top:2px">' + esc(b.d) + "</div>";
        h += '<div style="font-size:12px;color:' + acc + ';margin-top:6px">' + ft(b.s) + " - " + ft(b.e);
        if (curIdx+1 < blocks.length) h += '<span style="color:var(--sub)">｜次：' + ft(blocks[curIdx+1].s) + " " + esc(blocks[curIdx+1].t) + "</span>";
        h += "</div></div>";
      }
      h += "</div></div>";

      if (isGym(t)) {
        const m = MENUS[t];
        h += '<div class="sect"><div class="card cardp" style="border-color:' + acc + '44">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
          '<div style="font-size:15px;font-weight:700">今日は' + info.label + 'の日</div>' +
          '<button class="badge" data-tab="train" style="background:' + acc + '22;color:' + acc + ';border:1px solid ' + acc + '55">メニューを見る →</button></div>' +
          '<div style="font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.7">' +
          m.rows.filter((r) => r[0] !== "①" && r[3].indexOf("分") === -1).map((r) => esc(r[1].split(" ★")[0].split(" or ")[0])).join(" ／ ") +
          "</div></div></div>";
      }

      h += '<div class="sect"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">' +
        '<div class="stitle" style="margin:0">今日のチェック</div>' +
        '<div style="font-size:12px;color:' + (doneN===list.length?"var(--done)":"var(--sub)") + '">' + doneN + " / " + list.length + "</div></div>";
      h += '<div class="card" style="overflow:hidden">';
      list.forEach((c) => {
        const on = !!S.checked[c.id];
        h += '<button class="chk' + (on?" on":"") + '" data-check="' + c.id + '"><span class="box">' + (on?"✓":"") +
          '</span><span class="txt">' + esc(c.t) + "</span></button>";
      });
      h += "</div>";
      if (doneN === list.length) h += '<div style="text-align:center;color:var(--done);font-size:13px;margin-top:10px;font-weight:600">全チェック完了。今日もよくやりました</div>';
      h += "</div>";

      h += '<div class="sect"><div class="stitle">タイムライン</div><div class="card" style="overflow:hidden">';
      blocks.forEach((b, i) => {
        const cls = "tl" + (i===curIdx?" now":"") + (nowMin>=b.e?" past":"");
        h += '<div class="' + cls + '"><span class="tltime">' + ft(b.s) + "</span><div>" +
          '<div style="font-size:14px;font-weight:' + (i===curIdx?"700":"500") + '">' + esc(b.t) +
          (nowMin>=b.e ? ' <span style="color:var(--done);font-size:12px">✓</span>' : "") + "</div>" +
          (b.d ? '<div style="font-size:12px;color:var(--sub);margin-top:1px">' + esc(b.d) + "</div>" : "") + "</div></div>";
      });
      h += "</div></div>";

      /* 目標カード */
      const bd = Object.keys(S.bodyLog).sort();
      const last = bd.length ? S.bodyLog[bd[bd.length-1]] : null;
      h += '<div class="sect"><div class="card cardp">';
      h += '<div style="font-size:11px;color:var(--sub);letter-spacing:2px;font-weight:700">増量期</div>';
      if (last) {
        const w = parseFloat(last.w), bf = parseFloat(last.bf);
        const pw = Math.min(100, Math.max(0, ((w - 68.8) / (GOAL.triggerW - 68.8)) * 100));
        const pb = Math.min(100, Math.max(0, (bf / GOAL.triggerBf) * 100));
        h += '<div style="display:flex;gap:16px;margin-top:8px">' +
          '<div style="flex:1"><div style="font-size:12px;color:var(--sub)">体重 → 73kg</div>' +
          '<div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">' + last.w + '<span style="font-size:13px;color:var(--sub)">kg</span></div>' +
          '<div class="trigbar"><div style="width:' + pw + '%;height:100%;background:var(--now);border-radius:999px"></div></div>' +
          '<div style="font-size:11px;color:var(--sub);margin-top:4px">残り ' + (GOAL.triggerW - w).toFixed(1) + "kg</div></div>";
        h += '<div style="flex:1"><div style="font-size:12px;color:var(--sub)">体脂肪率 → 21%</div>' +
          '<div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">' + last.bf + '<span style="font-size:13px;color:var(--sub)">%</span></div>' +
          '<div class="trigbar"><div style="width:' + pb + '%;height:100%;background:' + (bf>=GOAL.triggerBf?"var(--red)":"var(--done)") + ';border-radius:999px"></div></div>' +
          '<div style="font-size:11px;color:var(--sub);margin-top:4px">残り ' + (GOAL.triggerBf - bf).toFixed(1) + "%</div></div></div>";
      }
      h += '<div style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +
        'どちらかに触れたら減量期へ切り替え。判断は<b style="color:var(--text)">1〜2週間のトレンド</b>で行い、単日の値では動かさない。<br>' +
        '摂取 約2,700kcal／タンパク質 140〜150g／水 約2.1L<br>最終目標：体脂肪率15%（68〜70kg）</div></div></div>';
    }

    /* ---- トレ ---- */
    if (S.tab === "train") {
      const view = S.trainView || (isGym(t) ? t : "push");
      const m = MENUS[view];
      const vAcc = DAY_TYPES[view].raw;

      h += '<div class="sect"><div class="seg">';
      [["push","月 プッシュ"],["pull","水 プル"],["legs","金 レッグ"]].forEach(([id,lb]) => {
        const on = view === id;
        h += '<button class="segbtn" data-train="' + id + '" style="' +
          (on ? "background:" + DAY_TYPES[id].raw + "22;color:" + DAY_TYPES[id].raw + ";" : "") + '">' + lb + "</button>";
      });
      h += "</div></div>";

      h += '<div class="sect"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">' +
        '<div class="stitle" style="margin:0;color:' + vAcc + '">' + m.day + "｜" + DAY_TYPES[view].label + "（" + DAY_TYPES[view].sub.split("／")[0] + "）</div>" +
        '<div style="font-size:11px;color:var(--sub)">' + m.total + "</div></div>";
      h += '<div class="card" style="overflow:hidden">';
      m.rows.forEach((r) => {
        h += '<div class="exrow"><div class="exhead"><span class="exnum" style="color:' + vAcc + '">' + r[0] + "</span>" +
          '<span class="exname">' + esc(r[1]) + '</span><span class="exset">' + esc(r[3]) + "</span></div>" +
          '<div class="exsub">' + r[2] + (r[4] !== "—" ? '　<span style="color:var(--line)">|</span>　休憩' + r[4] : "") + "</div></div>";
      });
      h += "</div>";
      h += '<div class="memo"><div style="color:var(--text);font-weight:700;margin-bottom:6px">メモ</div>' +
        m.memo.map((x) => "・" + x).join("<br>") + "</div>";
      h += '<div class="memo"><div style="color:var(--text);font-weight:700;margin-bottom:6px">共通ルール</div>' + COMMON_RULES + "</div>";
      h += '<button class="btn ghost" data-tab="log">この日の記録を入力する</button></div>';
    }

    /* ---- 記録 ---- */
    if (S.tab === "log") {
      const f = S.form;
      const lt = S.logType;
      const exList = LOG_EX[lt] || [];

      h += '<div class="sect"><div class="card cardp"><div class="stitle" style="margin-bottom:12px">トレーニングを記録</div>' +
        '<label class="lbl">実施日</label><input class="input" type="date" id="gDate" value="' + f.gDate + '">' +
        '<div style="margin-top:10px"><label class="lbl">メニュー</label><div class="seg">';
      [["push","プッシュ"],["pull","プル"],["legs","レッグ"]].forEach(([id,lb]) => {
        const on = lt === id;
        h += '<button class="segbtn" data-logtype="' + id + '" style="' +
          (on ? "background:" + DAY_TYPES[id].raw + "22;color:" + DAY_TYPES[id].raw + ";" : "") + '">' + lb + "</button>";
      });
      h += "</div></div></div>";

      h += '<div class="card" style="margin-top:14px;overflow:hidden">';
      exList.forEach((e) => {
        const v = S.logEx[e.k] || { w:"", r:"" };
        h += '<div class="logrow"><div class="logname">' + esc(e.n) + "</div>" +
          '<div class="loginputs"><div><span class="mini">' + esc(e.u) + '</span>' +
          '<input class="input sm" type="text" inputmode="text" data-ex="' + e.k + '" data-fld="w" value="' + esc(v.w) + '"></div>' +
          '<div style="flex:1.6"><span class="mini">実績（例 12/12/12/10）</span>' +
          '<input class="input sm" type="text" data-ex="' + e.k + '" data-fld="r" placeholder="' + (e.ph || "12/12/12") + '" value="' + esc(v.r) + '"></div></div></div>';
      });
      h += "</div>";

      h += '<div class="card cardp" style="margin-top:14px"><label class="lbl">メモ（任意）</label>' +
        '<input class="input" type="text" id="gNote" placeholder="例：3セット目でフォームが崩れた" value="' + esc(f.gNote) + '">' +
        '<button class="btn" data-act="saveGym">トレーニングを保存</button></div>';

      h += '<div class="card cardp" style="margin-top:16px"><div class="stitle" style="margin-bottom:12px">体組成を記録</div>' +
        '<label class="lbl">計測日</label><input class="input" type="date" id="bDate" value="' + f.bDate + '">' +
        '<div style="display:flex;gap:8px;margin-top:10px">' +
        '<div style="flex:1"><label class="lbl">体重 kg</label><input class="input" type="text" inputmode="decimal" id="bW" placeholder="72.0" value="' + esc(f.bW) + '"></div>' +
        '<div style="flex:1"><label class="lbl">体脂肪率 %</label><input class="input" type="text" inputmode="decimal" id="bF" placeholder="20.4" value="' + esc(f.bF) + '"></div>' +
        '<div style="flex:1"><label class="lbl">筋肉量 kg</label><input class="input" type="text" inputmode="decimal" id="bM" placeholder="54.3" value="' + esc(f.bM) + '"></div></div>' +
        '<div style="margin-top:10px"><label class="lbl">メモ（任意）</label><input class="input" type="text" id="bNote" placeholder="例：食後計測・条件が違う" value="' + esc(f.bNote) + '"></div>' +
        '<div style="font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6">計測条件は起床後・トイレ後・朝食前で固定。条件が違う日はメモに残して参考値扱いにする。</div>' +
        '<button class="btn" data-act="saveBody">体組成を保存</button></div></div>';
    }

    /* ---- カレンダー ---- */
    if (S.tab === "cal") {
      const firstDow = new Date(S.calY, S.calM, 1).getDay();
      const dim = new Date(S.calY, S.calM+1, 0).getDate();
      const cells = [];
      for (let i=0;i<firstDow;i++) cells.push(null);
      for (let d=1;d<=dim;d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      h += '<div class="sect"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
        '<button class="navbtn" data-act="prevM">‹</button>' +
        '<div style="font-size:17px;font-weight:700">' + S.calY + "年" + (S.calM+1) + "月</div>" +
        '<button class="navbtn" data-act="nextM">›</button></div>';
      h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px">';
      WD.forEach((w,i) => {
        const c = i===0?"var(--red)":i===6?"var(--blue)":"var(--sub)";
        h += '<div style="text-align:center;font-size:11px;font-weight:700;color:' + c + ';padding:4px 0">' + w + "</div>";
      });
      h += '</div><div class="calgrid">';
      cells.forEach((d) => {
        if (d === null) { h += "<div></div>"; return; }
        const dObj = new Date(S.calY, S.calM, d), key = dk(dObj);
        const hN = HOLIDAYS[key], ty = dayTypeOf(dObj);
        const isToday = key === todayStr, isSel = key === S.selDate, dow = dObj.getDay();
        const hasRec = !!(S.bodyLog[key] || S.gymLog[key]);
        const numC = (hN || dow===0) ? "var(--red)" : dow===6 ? "var(--blue)" : "var(--text)";
        const tc = DAY_TYPES[ty].raw;
        h += '<button class="calcell" data-sel="' + key + '" style="' +
          (isSel ? "background:" + tc + "26;" : "") +
          (isToday ? "border-color:var(--now);" : isSel ? "border-color:" + tc + "88;" : "") + '">' +
          '<span style="font-size:14px;font-weight:' + (isToday?"800":"500") + ";color:" + numC + ';line-height:1">' + d + "</span>" +
          '<span style="display:flex;gap:2px;align-items:center"><span class="dot" style="background:' + tc + '"></span>' +
          (hasRec ? '<span class="dot" style="background:var(--done)"></span>' : "") + "</span>" +
          (hN ? '<span style="font-size:8px;color:var(--red);line-height:1;white-space:nowrap;overflow:hidden;max-width:100%">' + esc(hN.slice(0,5)) + "</span>" : "") +
          "</button>";
      });
      h += "</div>";
      h += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--sub)">';
      [["#F5A524","月 プッシュ"],["#A78BFA","水 プル"],["#34D399","金 レッグ"],["#4AA8DE","休養（火木）"],["#8FDE4A","自由（土日）"],["#F87171","祝日"],["#4ADE80","記録あり"]].forEach(([c,l]) => {
        h += '<span style="display:flex;align-items:center;gap:4px"><span class="dot" style="width:7px;height:7px;background:' + c + '"></span>' + l + "</span>";
      });
      h += "</div>";

      const sd = S.selDate;
      const sObj = new Date(+sd.slice(0,4), +sd.slice(5,7)-1, +sd.slice(8,10));
      const sTy = dayTypeOf(sObj), sHol = hol(sObj), sInfo = DAY_TYPES[sTy];
      const sB = S.bodyLog[sd], sG = S.gymLog[sd];
      h += '<div class="card cardp" style="margin-top:14px">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="font-size:15px;font-weight:700">' + (+sd.slice(5,7)) + "月" + (+sd.slice(8,10)) + "日（" + WD[sObj.getDay()] + "）</span>" +
        '<span class="badge" style="background:' + sInfo.raw + "22;color:" + sInfo.raw + ";border:1px solid " + sInfo.raw + '55;font-size:12px;padding:3px 10px">' +
        (sHol ? "祝日・" + esc(sHol) : sInfo.label) + "</span></div>" +
        '<div style="font-size:12.5px;color:var(--sub);margin-top:6px">' + sInfo.sub + "</div>";
      if (isGym(sTy)) {
        h += '<div style="font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px">' +
          MENUS[sTy].rows.slice(1,-2).map((r) => esc(r[1].split(" ★")[0]) + " " + esc(r[3])).join("<br>") + "</div>";
      }
      h += '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +
        '<div style="font-size:12px;color:var(--sub);margin-bottom:4px">この日の記録</div>';
      if (!sB && !sG) {
        h += '<div style="font-size:13px;color:var(--sub)">記録なし（「記録」タブから日付を指定して入力できます）</div>';
      } else {
        h += '<div style="font-size:13.5px;line-height:1.8">';
        if (sB) {
          const p = [];
          if (sB.w) p.push("体重" + sB.w + "kg");
          if (sB.bf) p.push("体脂肪率" + sB.bf + "%");
          if (sB.mm) p.push("筋肉量" + sB.mm + "kg");
          if (sB.note) p.push(sB.note);
          h += '<div><span style="color:var(--now);font-weight:700">体組成：</span>' + esc(p.join("・")) + "</div>";
        }
        if (sG) {
          const defs = LOG_EX[sG.type] || [];
          const p = defs.filter((e) => sG.ex && sG.ex[e.k] && (sG.ex[e.k].w || sG.ex[e.k].r))
            .map((e) => e.n + " " + (sG.ex[e.k].w||"") + (sG.ex[e.k].r ? "×" + sG.ex[e.k].r : ""));
          h += '<div><span style="color:var(--done);font-weight:700">トレ（' + (DAY_TYPES[sG.type]||{label:""}).label + '）：</span>' +
            esc(p.join(" ／ ")) + (sG.note ? "<br><span style=\"color:var(--sub)\">" + esc(sG.note) + "</span>" : "") + "</div>";
        }
        h += "</div>";
      }
      h += "</div></div>";
      h += '<div style="font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6;padding:0 2px">祝日は内閣府公表の2026年・2027年データに基づき自動判定。祝日は自由日扱いで表示します。</div></div>';
    }

    /* ---- データ ---- */
    if (S.tab === "data") {
      h += '<div class="sect"><div class="card cardp"><div class="stitle" style="margin-bottom:4px">Claudeに渡すデータ</div>' +
        '<div style="font-size:12.5px;color:var(--sub);line-height:1.6">体組成・トレーニング記録・今日のチェック状況をまとめてコピーします。トレーニング記録はMarkdownの表形式なので、メニューファイルにそのまま貼れます。</div>' +
        '<button class="btn" data-act="export">' + (S.copied ? "✓ コピーしました" : "分析用データをコピー") + "</button>";
      if (S.exportText) {
        h += '<div style="margin-top:12px"><label class="lbl">' +
          (S.copied ? "コピー済み。以下からも選択できます" : "コピーできない場合は以下を長押しで選択してください") + "</label>" +
          '<textarea class="input" readonly id="exportArea">' + esc(S.exportText) + "</textarea></div>";
      }
      h += "</div>";

      const recent = Object.keys(S.bodyLog).sort().slice(-8).reverse();
      h += '<div class="card cardp" style="margin-top:16px"><div class="stitle">体組成の推移</div>';
      if (!recent.length) {
        h += '<div style="font-size:13px;color:var(--sub)">まだ記録がありません。</div>';
      } else {
        h += '<div style="display:flex;font-size:11px;color:var(--sub);padding-bottom:6px;border-bottom:1px solid var(--line)">' +
          '<span style="flex:1.4">日付</span><span style="flex:1;text-align:right">体重</span>' +
          '<span style="flex:1;text-align:right">体脂肪</span><span style="flex:1;text-align:right">筋肉量</span></div>';
        recent.forEach((d) => {
          const r = S.bodyLog[d];
          h += '<div style="display:flex;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)">' +
            '<span style="flex:1.4;color:var(--sub)">' + d.slice(5).replace("-","/") + "</span>" +
            '<span style="flex:1;text-align:right">' + (r.w||"—") + "</span>" +
            '<span style="flex:1;text-align:right">' + (r.bf ? r.bf+"%" : "—") + "</span>" +
            '<span style="flex:1;text-align:right">' + (r.mm||"—") + "</span></div>";
        });
        const bd = Object.keys(S.bodyLog).sort();
        if (bd.length >= 2) {
          const a = S.bodyLog[bd[0]], b = S.bodyLog[bd[bd.length-1]];
          const fa = parseFloat(a.w)*parseFloat(a.bf)/100, fb = parseFloat(b.w)*parseFloat(b.bf)/100;
          const la = parseFloat(a.w)-fa, lb = parseFloat(b.w)-fb;
          const dw = parseFloat(b.w)-parseFloat(a.w), dl = lb-la, df = fb-fa;
          const wk = (new Date(bd[bd.length-1]) - new Date(bd[0])) / (7*86400000);
          h += '<div style="font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.8">' +
            "開始からの増加 <b style=\"color:var(--text)\">" + dw.toFixed(2) + "kg</b>（除脂肪 +" + dl.toFixed(2) + "kg／脂肪 +" + df.toFixed(2) + "kg）<br>" +
            "除脂肪の割合 <b style=\"color:var(--done)\">" + Math.round(dl/dw*100) + "%</b>　ペース <b style=\"color:var(--text)\">週+" + (dw/wk).toFixed(2) + "kg</b>（目標 +0.2〜0.3）</div>";
        }
      }
      h += "</div>";

      const gd = Object.keys(S.gymLog).sort().reverse();
      h += '<div class="card cardp" style="margin-top:16px"><div class="stitle">トレーニング履歴</div>';
      if (!gd.length) {
        h += '<div style="font-size:13px;color:var(--sub)">まだ記録がありません。</div>';
      } else {
        gd.slice(0,10).forEach((d) => {
          const r = S.gymLog[d], di = DAY_TYPES[r.type] || { raw:"var(--sub)", label:"" };
          const defs = LOG_EX[r.type] || [];
          const p = defs.filter((e) => r.ex && r.ex[e.k] && r.ex[e.k].r)
            .map((e) => e.n + " " + (r.ex[e.k].w||"") + "×" + r.ex[e.k].r);
          h += '<div style="padding:10px 0;border-bottom:1px solid var(--line)">' +
            '<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--sub)">' + d.slice(5).replace("-","/") + "</span>" +
            '<span class="badge" style="background:' + di.raw + "22;color:" + di.raw + ';font-size:11px;padding:2px 8px">' + di.label + "</span></div>" +
            '<div style="font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.7">' + esc(p.join(" ／ ")) + "</div></div>";
        });
      }
      h += "</div></div>";
    }

    document.getElementById("app").innerHTML = h;
    bindEvents();
  }

  /* ============ フォーム退避 ============ */
  function captureForm() {
    ["bDate","bW","bF","bM","bNote","gDate","gNote"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) S.form[id] = el.value;
    });
    document.querySelectorAll("[data-ex]").forEach((el) => {
      const k = el.dataset.ex, f = el.dataset.fld;
      if (!S.logEx[k]) S.logEx[k] = { w:"", r:"" };
      S.logEx[k][f] = el.value;
    });
  }

  function buildExport() {
    const now = S.now, t = dayTypeOf(now), holName = hol(now), info = DAY_TYPES[t];
    const list = checklistOf(t);
    const bd = Object.keys(S.bodyLog).sort(), gd = Object.keys(S.gymLog).sort();
    let txt = "【フィットネス記録データ】\n出力：" + dk(now) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) +
      "\n現在：増量期（トリガー 体重73〜75kg または 体脂肪率21%超）\n最終目標：体脂肪率15%\n\n";

    txt += "■ 体組成（" + bd.length + "件）\n";
    if (!bd.length) txt += "（記録なし）\n";
    bd.forEach((d) => {
      const r = S.bodyLog[d], p = [];
      if (r.w) p.push("体重" + r.w + "kg");
      if (r.bf) p.push("体脂肪率" + r.bf + "%");
      if (r.mm) p.push("筋肉量" + r.mm + "kg");
      if (r.note) p.push("メモ:" + r.note);
      txt += d + "：" + p.join("・") + "\n";
    });

    txt += "\n■ トレーニング記録（Markdown表・そのまま貼れます）\n";
    txt += "| 日付 | 種目 | 重量・設定 | 実績 | メニュー |\n|------|------|-----------|------|------|\n";
    if (!gd.length) txt += "（記録なし）\n";
    gd.forEach((d) => {
      const r = S.gymLog[d], defs = LOG_EX[r.type] || [];
      const lb = (DAY_TYPES[r.type] || { label:"" }).label;
      defs.forEach((e) => {
        const v = r.ex && r.ex[e.k];
        if (!v || (!v.w && !v.r)) return;
        txt += "| " + d + " | " + e.n + " | " + (v.w||"") + " | " + (v.r||"") + " | " + lb + " |\n";
      });
      if (r.note) txt += "（" + d + " メモ：" + r.note + "）\n";
    });

    const done = list.filter((c) => S.checked[c.id]).map((c) => c.t);
    const undone = list.filter((c) => !S.checked[c.id]).map((c) => c.t);
    txt += "\n■ 今日（" + dk(now) + "・" + (holName ? "祝日:"+holName : info.label) + "）のチェック\n完了：" +
      (done.length ? done.join("／") : "なし") + "\n未完了：" + (undone.length ? undone.join("／") : "なし") +
      "\n\nこのデータをもとに、進捗の分析と次回の重量設定をお願いします。";
    return txt;
  }

  /* ============ イベント ============ */
  function bindEvents() {
    document.querySelectorAll("[data-tab]").forEach((el) => {
      el.onclick = () => {
        captureForm();
        S.tab = el.dataset.tab;
        if (S.tab === "log") loadLogForm();
        render();
      };
    });
    document.querySelectorAll("[data-train]").forEach((el) => {
      el.onclick = () => { S.trainView = el.dataset.train; render(); };
    });
    document.querySelectorAll("[data-logtype]").forEach((el) => {
      el.onclick = () => { captureForm(); S.logType = el.dataset.logtype; loadLogForm(); render(); };
    });
    document.querySelectorAll("[data-check]").forEach((el) => {
      el.onclick = async () => {
        const id = el.dataset.check;
        S.checked[id] = !S.checked[id];
        render();
        await store.set("check:" + dk(S.now), JSON.stringify(S.checked));
      };
    });
    document.querySelectorAll("[data-sel]").forEach((el) => {
      el.onclick = () => { S.selDate = el.dataset.sel; render(); };
    });
    const gDateEl = document.getElementById("gDate");
    if (gDateEl) gDateEl.onchange = () => {
      captureForm();
      const d = new Date(gDateEl.value + "T00:00:00");
      if (!isNaN(d)) { const ty = dayTypeOf(d); if (isGym(ty)) S.logType = ty; }
      loadLogForm(); render();
    };
    document.querySelectorAll("[data-act]").forEach((el) => {
      el.onclick = async () => {
        const act = el.dataset.act;
        if (act === "refresh") {
          captureForm();
          const d = new Date();
          S.now = d; S.calY = d.getFullYear(); S.calM = d.getMonth();
          await loadAll(); render();
        }
        if (act === "prevM" || act === "nextM") {
          let y = S.calY, mo = S.calM + (act === "nextM" ? 1 : -1);
          if (mo < 0) { mo = 11; y--; }
          if (mo > 11) { mo = 0; y++; }
          S.calY = y; S.calM = mo; render();
        }
        if (act === "saveBody") {
          captureForm();
          const f = S.form;
          if (!f.bW && !f.bF && !f.bM) { flash("数値を入力してください"); return; }
          S.bodyLog[f.bDate] = { w:f.bW||null, bf:f.bF||null, mm:f.bM||null, note:f.bNote||"" };
          const ok = await store.set("bodylog", JSON.stringify(S.bodyLog));
          S.form.bNote = "";
          flash(ok ? "体組成を保存しました" : "保存に失敗しました");
        }
        if (act === "saveGym") {
          captureForm();
          const f = S.form;
          const ex = {};
          let any = false;
          (LOG_EX[S.logType] || []).forEach((e) => {
            const v = S.logEx[e.k] || { w:"", r:"" };
            ex[e.k] = { w:v.w||"", r:v.r||"" };
            if (v.r) any = true;
          });
          if (!any) { flash("実績（回数）を1種目以上入力してください"); return; }
          S.gymLog[f.gDate] = { type:S.logType, ex:ex, note:f.gNote||"" };
          const ok = await store.set("gymlog", JSON.stringify(S.gymLog));
          flash(ok ? "トレーニングを保存しました" : "保存に失敗しました");
        }
        if (act === "export") {
          S.exportText = buildExport();
          try { await navigator.clipboard.writeText(S.exportText); S.copied = true; }
          catch { S.copied = false; }
          render();
          setTimeout(() => { S.copied = false; render(); }, 2500);
        }
      };
    });
    const ta = document.getElementById("exportArea");
    if (ta) ta.onfocus = () => ta.select();
  }

  /* ============ 初期化 ============ */
  (async function init() {
    const d = new Date();
    S.now = d; S.calY = d.getFullYear(); S.calM = d.getMonth();
    S.selDate = dk(d);
    S.form.bDate = dk(d); S.form.gDate = dk(d);
    const ty = dayTypeOf(d);
    S.logType = isGym(ty) ? ty : "push";
    S.trainView = isGym(ty) ? ty : "push";
    await loadAll();
    loadLogForm();
    render();
    setInterval(() => {
      const prev = dk(S.now);
      S.now = new Date();
      if (S.tab === "today" || prev !== dk(S.now)) {
        if (prev !== dk(S.now)) loadAll().then(render);
        else render();
      }
    }, 15000);
  })();
})();
</script>
</body>
</html>
